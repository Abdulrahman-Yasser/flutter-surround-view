# Placeholder board positions, measure and correct before use. Set each
# camera's lens to the lens file it uses (any mix of pinhole and fisheye).
# Each camera is solved from its own board; the seams are not measured, so
# they line up only as well as the board positions were measured.
name = Four cameras: middle boards
car_width = 1.8
car_length = 4.5

[camera]
slot = 0
facing = front
lens = imx219

[camera]
slot = 1
facing = right
lens = imx219

[camera]
slot = 2
facing = back
lens = imx219

[camera]
slot = 3
facing = left
lens = imx219

