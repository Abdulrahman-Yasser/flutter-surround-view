# Placeholder board positions, measure and correct before use. Set each
# camera's lens to the lens file it uses (any mix of pinhole and fisheye).
name = Four cameras: middle + corner squares
car_width = 1.8
car_length = 4.5

[camera]
slot = 0
facing = front
lens = imx219

[camera]
slot = 1
facing = right
lens = imx219

[camera]
slot = 2
facing = back
lens = imx219

[camera]
slot = 3
facing = left
lens = imx219

# One ChArUco board in front of each camera, the same printed set as the
# other presets.
