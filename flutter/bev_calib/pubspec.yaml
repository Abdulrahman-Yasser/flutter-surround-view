name: bev_calib
description: >
  ChArUco calibration for the surround-view pipeline: lens intrinsics and the
  per-camera car-frame homographies bev_config.ini holds, with the screens that
  drive them. A native-assets hook builds libbev_calib.so (OpenCV, CPU only)
  from this repository's CMake project.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.1"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  code_assets: ">=0.19.7 <3.0.0"
  hooks: ">=0.20.1 <3.0.0"

dev_dependencies:
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  # Preset setups; the app copies them somewhere writable on first run so the
  # board positions can be measured and corrected on the device.
  assets:
    - layouts/
